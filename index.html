<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar 2 Digital Layout | Aspirealty</title>
    <!-- CSS and Icon Libraries -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Full-Screen Map Viewport Container -->
        <main class="map-viewport" id="mapViewport">
            
            <!-- CENTRAL CONTROL DOCK -->
            <div class="control-dock-wrapper" id="controlDockWrapper">
                <!-- Horizontal Navigation Dock -->
                <div class="control-dock" id="controlDock">
                    <div class="dock-item brand-item" id="dockBrand" title="Fit Layout / Recenter">
                        <i class="fa-solid fa-map-location-dot"></i>
                        <span>AVATAR 2</span>
                    </div>
                    <div class="dock-divider"></div>
                    <button class="dock-item tab-btn" data-tab="search" id="tabSearchBtn">
                        <i class="fa-solid fa-magnifying-glass"></i> Search
                    </button>
                    <button class="dock-item tab-btn" data-tab="status" id="tabStatusBtn">
                        <i class="fa-solid fa-chart-pie"></i> Status
                    </button>
                    <button class="dock-item tab-btn" data-tab="facing" id="tabFacingBtn">
                        <i class="fa-solid fa-compass"></i> Facing
                    </button>
                    <div class="dock-divider"></div>
                    <button class="dock-item login-item" id="staffLoginBtn" title="Staff Login">
                        <i class="fa-solid fa-lock"></i>
                    </button>
                </div>
                
                <!-- Dropdown panel for active tab -->
                <div class="dock-dropdown-panel" id="dockDropdownPanel">
                    <!-- Search Tab Content -->
                    <div class="dock-tab-content" id="tabContentSearch" style="display: none;">
                        <div class="search-container">
                            <div class="search-input-wrapper">
                                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                                <input type="text" class="search-input" id="searchInput" placeholder="Search Plot No. (e.g. 50)">
                                <button class="search-clear-btn" id="searchClearBtn"><i class="fa-solid fa-circle-xmark"></i></button>
                            </div>
                            <div class="search-suggestions" id="searchSuggestions"></div>
                        </div>
                    </div>
                    
                    <!-- Status Tab Content -->
                    <div class="dock-tab-content" id="tabContentStatus" style="display: none;">
                        <div class="legend-grid" id="statusLegendList">
                            <!-- Dynamic rendering by app.js -->
                        </div>
                    </div>
                    
                    <!-- Facing Tab Content -->
                    <div class="dock-tab-content" id="tabContentFacing" style="display: none;">
                        <div class="facing-section">
                            <div class="section-header">
                                <span class="section-title">Filter by Facing</span>
                                <button class="filter-reset-btn" id="facingResetBtn">Clear</button>
                            </div>
                            <div class="filter-grid" id="facingFilterGrid">
                                <button class="filter-pill" data-facing="East">East</button>
                                <button class="filter-pill" data-facing="West">West</button>
                                <button class="filter-pill" data-facing="North">North</button>
                                <button class="filter-pill" data-facing="South">South</button>
                                <button class="filter-pill" data-facing="North-East">N-East</button>
                                <button class="filter-pill" data-facing="North-West">N-West</button>
                                <button class="filter-pill" data-facing="South-East">S-East</button>
                                <button class="filter-pill" data-facing="South-West">S-West</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- FLOATING WIDGET: Top-Left Admin CMS Panel (only when logged in) -->
            <div class="floating-panel admin-panel" id="mapperSection" style="display: none; top: 90px; left: 20px;">
                <div class="section-header">
                    <span class="section-title" style="color: var(--accent); margin-bottom: 0;"><i class="fa-solid fa-map-pin"></i> Coordinate Mapper</span>
                    <button class="filter-reset-btn" id="toggleMapperBtn">Start</button>
                </div>
                <div id="mapperPanel" style="display: none; margin-top: 12px;">
                    <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 12px;">
                        <span style="font-size: 11px; font-weight: 600; color: var(--text-primary);">Active: Plot #</span>
                        <input type="number" id="mapperActivePlot" style="width: 60px; background: var(--bg-tertiary); border: 1px solid var(--border-color); color: #fff; padding: 4px 6px; border-radius: 6px; font-size: 12px;" value="1" min="1" max="96">
                    </div>
                    <div style="max-height: 100px; overflow-y: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 4px; background: rgba(0,0,0,0.2); border-radius: 8px; margin-bottom: 12px;" id="mapperPlotList">
                        <!-- 1 to 96 buttons -->
                    </div>
                    <button id="mapperExportBtn" class="action-btn-sm" style="width: 100%;">
                        <i class="fa-solid fa-download"></i> Export Coords Config
                    </button>
                </div>
            </div>

            <!-- FLOATING WIDGET: Bottom-Right Map Controls -->
            <div class="map-controls">
                <button class="map-control-btn" id="zoomInBtn" title="Zoom In"><i class="fa-solid fa-plus"></i></button>
                <button class="map-control-btn" id="zoomOutBtn" title="Zoom Out"><i class="fa-solid fa-minus"></i></button>
                <button class="map-control-btn" id="recenterBtn" title="Recenter Map"><i class="fa-solid fa-arrows-to-dot"></i></button>
            </div>

            <!-- Drag/Zoom Container (exact landscape size 1024x646) -->
            <div class="map-container" id="mapContainer">
                <img src="map_layout.jpg" alt="Aspirealty Avatar 2 Project Layout" class="map-image" id="mapImage">
                <!-- Dynamic overlay nodes go here -->
                <div class="plots-overlay" id="plotsOverlay"></div>
            </div>

            <!-- Drag/Zoom Instructions -->
            <div class="map-tip" id="mapTip">
                <i class="fa-solid fa-hand-pointer"></i> Drag to Pan &bull; Scroll or pinch to zoom
            </div>
        </main>
    </div>

    <!-- Custom Animated Plot Details Modal -->
    <div class="modal-backdrop" id="modalBackdrop">
        <div class="custom-modal" id="plotModal">
            <div class="modal-header">
                <h3 class="modal-title">Plot Details</h3>
                <button class="modal-close" id="modalCloseBtn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Populated dynamically by app.js -->
            </div>
        </div>
    </div>

    <!-- Staff Login Modal -->
    <div class="modal-backdrop" id="loginModalBackdrop">
        <div class="custom-modal login-modal" id="loginModal">
            <div class="modal-header">
                <h3 class="modal-title"><i class="fa-solid fa-lock"></i> Staff Login</h3>
                <button class="modal-close" id="loginModalCloseBtn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" style="padding: 10px 0;">
                <form id="loginForm" style="display: flex; flex-direction: column; gap: 14px;">
                    <div style="display: flex; flex-direction: column; gap: 6px; text-align: left;">
                        <label style="font-size: 11px; font-weight: 600; color: var(--text-secondary);">Username</label>
                        <input type="text" id="loginUsername" required style="background: var(--bg-tertiary); border: 1px solid var(--border-color); color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 13px; outline: none;" placeholder="Enter username">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 6px; text-align: left;">
                        <label style="font-size: 11px; font-weight: 600; color: var(--text-secondary);">Password</label>
                        <input type="password" id="loginPassword" required style="background: var(--bg-tertiary); border: 1px solid var(--border-color); color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 13px; outline: none;" placeholder="Enter password">
                    </div>
                    <div id="loginError" style="color: var(--status-mortgage); font-size: 11px; text-align: left; display: none; font-weight: 600; margin-top: 2px;">
                        <i class="fa-solid fa-circle-exclamation"></i> Invalid credentials!
                    </div>
                    <button type="submit" class="action-btn-sm" style="background-color: var(--accent); color: #fff; border: none; font-weight: 700; padding: 12px; font-size: 13px; margin-top: 6px; cursor: pointer; border-radius: 8px; width:100%; justify-content:center;">
                        Login
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Load scripts -->
    <script src="plot_coords.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
